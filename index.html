<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watering System Switch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 350px;
        }

        h1 {
            font-weight: 600;
            margin: 0 0 5px 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .switch-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            outline: none;
        }

        .switch-btn.off {
            background: #334155;
            color: #64748b;
            box-shadow: 
                inset 8px 8px 16px rgba(0,0,0,0.4), 
                inset -8px -8px 16px rgba(255,255,255,0.05),
                0 10px 20px rgba(0,0,0,0.2);
        }

        .switch-btn.off:hover {
            transform: scale(1.05);
            background: #3b4b63;
        }

        .switch-btn.on {
            background: #10b981;
            color: white;
            box-shadow: 
                0 0 30px rgba(16, 185, 129, 0.6), 
                inset 4px 4px 10px rgba(255,255,255,0.3),
                inset -4px -4px 10px rgba(0,0,0,0.2);
            transform: scale(1.05);
        }

        .status-container {
            margin-top: 40px;
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
            display: inline-block;
        }

        .status-text {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-text.on { color: #34d399; }
        .status-text.off { color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Watering System</h1>
        <p>Smart Control Panel</p>
        
        <button id="toggleBtn" class="switch-btn off">OFF</button>
        
        <div class="status-container">
            <div id="statusText" class="status-text off">KONEKSI...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAes_0cn-mkmgxCdYGObX5knasM3Gs5WO4",
            authDomain: "arduino-kokulikuler.firebaseapp.com",
            databaseURL: "https://arduino-kokulikuler-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "arduino-kokulikuler",
            storageBucket: "arduino-kokulikuler.firebasestorage.app",
            messagingSenderId: "551582689767",
            appId: "1:551582689767:web:1aa9210339b4f0cbc6b542"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pumpRef = ref(db, 'pompa_status'); 

        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('statusText');
        let currentStatus = "OFF";

        // 🎵 Sound effect elektronik
        const soundOn = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
        const soundOff = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

        onValue(pumpRef, (snapshot) => {
            const data = snapshot.val();
            if(data !== null) {
                currentStatus = data;
                updateUI(currentStatus);
            }
        });

        toggleBtn.addEventListener('click', () => {
            statusText.innerText = "MENGIRIM..."; 
            const newStatus = currentStatus === "ON" ? "OFF" : "ON";
            set(pumpRef, newStatus).catch((error) => {
                console.error("Gagal mengubah data:", error);
                alert("Gagal terhubung ke Firebase!");
            });
        });

        function updateUI(status) {
            if (status === "ON") {
                // ON di interface = Pompa OFF
                toggleBtn.className = "switch-btn on";
                toggleBtn.innerText = "ON";
                statusText.className = "status-text on";
                statusText.innerText = "POMPA NYALA";
                soundOn.play();

                // 📳 Getaran singkat
                if (navigator.vibrate) {
                    navigator.vibrate(100);
                }
            } else {
                // OFF di interface = Pompa ON
                toggleBtn.className = "switch-btn off";
                toggleBtn.innerText = "OFF";
                statusText.className = "status-text off";
                statusText.innerText = "POMPA MATI";
                soundOff.play();

                // 📳 Getaran pola (dua kali)
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]);
                }
            }
        }
    </script>
</body>
</html>
