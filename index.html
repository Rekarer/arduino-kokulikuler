<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Watering System Switch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 350px;
        }

        h1 {
            font-weight: 600;
            margin: 0 0 5px 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .switch-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            outline: none;
        }

        .switch-btn.off {
            background: #334155;
            color: #64748b;
            box-shadow: 
                inset 8px 8px 16px rgba(0,0,0,0.4), 
                inset -8px -8px 16px rgba(255,255,255,0.05),
                0 10px 20px rgba(0,0,0,0.2);
        }

        .switch-btn.off:hover {
            transform: scale(1.05);
            background: #3b4b63;
        }

        .switch-btn.on {
            background: #10b981;
            color: white;
            box-shadow: 
                0 0 30px rgba(16, 185, 129, 0.6), 
                inset 4px 4px 10px rgba(255,255,255,0.3),
                inset -4px -4px 10px rgba(0,0,0,0.2);
            transform: scale(1.05);
        }

        .status-container {
            margin-top: 40px;
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
            display: inline-block;
        }

        .status-text {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-text.on { color: #34d399; }
        .status-text.off { color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Watering System</h1>
        <p>Smart Control Panel</p>
        
        <button id="toggleBtn" class="switch-btn off">OFF</button>
        
        <div class="status-container">
            <div id="statusText" class="status-text off">KONEKSI...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAes_0cn-mkmgxCdYGObX5knasM3Gs5WO4",
            authDomain: "arduino-kokulikuler.firebaseapp.com",
            databaseURL: "https://arduino-kokulikuler-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "arduino-kokulikuler",
            storageBucket: "arduino-kokulikuler.firebasestorage.app",
            messagingSenderId: "551582689767",
            appId: "1:551582689767:web:1aa9210339b4f0cbc6b542"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pumpRef = ref(db, 'pompa_status'); 

        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('statusText');
        
        // Variabel untuk menyimpan nilai dari Firebase (raw value)
        let currentRawValue = "OFF";
        
        // Sound effect (sama seperti desain awal, menggunakan beep)
        const clickSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
        // Preload sound agar responsif
        clickSound.load();
        
        // Fungsi untuk memainkan suara dan getaran sesuai aksi
        function playFeedback(action) {
            // action: "on" untuk menyalakan pompa, "off" untuk mematikan pompa
            try {
                // Clone audio agar bisa diputar berkali-kali tanpa delay
                const soundClone = clickSound.cloneNode();
                soundClone.volume = 0.5;
                soundClone.play().catch(e => console.log("Audio play error:", e));
            } catch(e) {}
            
            // Fitur getaran (haptic)
            if (navigator.vibrate) {
                if (action === "on") {
                    // Getaran pendek untuk menyalakan
                    navigator.vibrate(80);
                } else {
                    // Getaran dua kali untuk mematikan
                    navigator.vibrate([60, 40, 60]);
                }
            }
        }
        
        // ========== LOGIKA TERBALIK ==========
        // Karena kode Arduino salah (misal: saat menerima "OFF" justru menyalakan pompa, 
        // dan "ON" mematikan pompa), maka website perlu membalik logika.
        //
        // Penjelasan:
        // - Jika USER ingin POMPA NYALA (fisik menyala) -> tombol harus tampil "ON", 
        //   dan kita KIRIM "OFF" ke Firebase (karena Arduino salah).
        // - Jika USER ingin POMPA MATI (fisik mati) -> tombol tampil "OFF", 
        //   dan kita KIRIM "ON" ke Firebase.
        //
        // Saat membaca dari Firebase (nilai mentah):
        // - Jika database berisi "OFF" (mentah) -> seharusnya pompa fisik NYALA, 
        //   jadi UI menampilkan status "POMPA NYALA" dan tombol "ON".
        // - Jika database berisi "ON" (mentah) -> pompa fisik MATI, 
        //   UI menampilkan "POMPA MATI" dan tombol "OFF".
        // =====================================
        
        function updateUIFromDatabase(rawValue) {
            // rawValue: nilai dari Firebase ('ON' atau 'OFF')
            let isPumpPhysicalOn = false;
            
            if (rawValue === "OFF") {
                // OFF di database = pompa fisik NYALA (karena kesalahan Arduino)
                isPumpPhysicalOn = true;
            } else if (rawValue === "ON") {
                // ON di database = pompa fisik MATI
                isPumpPhysicalOn = false;
            }
            
            // Update tampilan tombol dan status text berdasarkan kondisi fisik pompa
            if (isPumpPhysicalOn) {
                // Pompa menyala -> tampilkan tombol ON, status POMPA NYALA
                toggleBtn.className = "switch-btn on";
                toggleBtn.innerText = "ON";
                statusText.className = "status-text on";
                statusText.innerText = "POMPA NYALA";
            } else {
                // Pompa mati -> tampilkan tombol OFF, status POMPA MATI
                toggleBtn.className = "switch-btn off";
                toggleBtn.innerText = "OFF";
                statusText.className = "status-text off";
                statusText.innerText = "POMPA MATI";
            }
        }
        
        // Fungsi untuk mengirim nilai ke Firebase (dengan logika terbalik)
        function sendCommand(userWantsPumpOn) {
            // userWantsPumpOn: true = user ingin menyalakan pompa, false = ingin mematikan
            let valueToSend;
            if (userWantsPumpOn) {
                // Ingin menyalakan pompa -> kirim "OFF" (karena Arduino salah)
                valueToSend = "OFF";
            } else {
                // Ingin mematikan pompa -> kirim "ON" (karena Arduino salah)
                valueToSend = "ON";
            }
            
            // Tampilkan feedback "MENGIRIM..."
            statusText.innerText = "MENGIRIM...";
            toggleBtn.style.opacity = "0.7";
            
            // Kirim ke Firebase
            set(pumpRef, valueToSend)
                .then(() => {
                    // Sukses, play feedback sesuai aksi yang diminta user
                    playFeedback(userWantsPumpOn ? "on" : "off");
                })
                .catch((error) => {
                    console.error("Gagal mengubah data:", error);
                    statusText.innerText = "GAGAL!";
                    toggleBtn.style.opacity = "1";
                    setTimeout(() => {
                        // Refresh UI dengan nilai terbaru dari database
                        onValue(pumpRef, (snap) => {
                            if (snap.exists()) updateUIFromDatabase(snap.val());
                        }, { onlyOnce: true });
                    }, 1000);
                });
        }
        
        // Event listener tombol klik
        toggleBtn.addEventListener('click', () => {
            // Cek kondisi tombol saat ini (berdasarkan class)
            const isCurrentlyOn = toggleBtn.classList.contains("on");
            
            // Jika tombol saat ini "ON" (artinya pompa fisik sedang menyala), 
            // user ingin mematikan -> userWantsPumpOn = false
            // Jika tombol saat ini "OFF" (pompa fisik mati), user ingin menyalakan -> userWantsPumpOn = true
            const userWantsPumpOn = !isCurrentlyOn;
            
            // Kirim perintah dengan logika terbalik
            sendCommand(userWantsPumpOn);
        });
        
        // Listener realtime dari Firebase
        onValue(pumpRef, (snapshot) => {
            const data = snapshot.val();
            if (data !== null && (data === "ON" || data === "OFF")) {
                currentRawValue = data;
                updateUIFromDatabase(currentRawValue);
            } else if (data === null) {
                // Jika data belum ada, inisialisasi dengan nilai yang aman
                // Pilih default: pompa dalam keadaan mati (fisik mati) -> kirim "ON" ke database
                console.log("Data kosong, inisialisasi dengan 'ON' (pompa mati fisik)");
                set(pumpRef, "ON").catch(e => console.warn(e));
                statusText.innerText = "INIT...";
            }
        }, (error) => {
            console.error("Gagal mendengar perubahan:", error);
            statusText.innerText = "ERROR";
        });
        
        // Efek sentuhan mikro (opsional, tetap menjaga desain)
        toggleBtn.addEventListener('touchstart', () => {
            toggleBtn.style.transform = "scale(0.96)";
        });
        toggleBtn.addEventListener('touchend', () => {
            toggleBtn.style.transform = "";
        });
        toggleBtn.addEventListener('mousedown', () => {
            toggleBtn.style.transform = "scale(0.96)";
        });
        toggleBtn.addEventListener('mouseup', () => {
            toggleBtn.style.transform = "";
        });
        
        console.log("✅ REVERSE LOGIC ACTIVE: Tombol ON = Pompa NYALA (kirim OFF ke DB) | Tombol OFF = Pompa MATI (kirim ON ke DB)");
    </script>
</body>
</html>
