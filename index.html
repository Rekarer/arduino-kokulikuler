<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Watering Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #0b0f19;
            --bg-card: #131926;
            --border-color: #1e293b;
            --text-muted: #64748b;
            --text-light: #f8fafc;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Header Style */
        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Control Section */
        .control-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .control-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }
        .status-badge.on { color: var(--accent-green); }
        .status-badge.off { color: var(--accent-red); }

        /* Sleek Modern Switch */
        .power-switch {
            position: relative;
            width: 72px;
            height: 40px;
            appearance: none;
            background: #1e293b;
            border-radius: 20px;
            outline: none;
            cursor: pointer;
            transition: background 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .power-switch::before {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            background: #64748b;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
        }

        .power-switch:checked {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .power-switch:checked::before {
            transform: translateX(32px);
            background: var(--accent-green);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        /* Interval Section */
        .interval-section {
            border-top: 1px dashed var(--border-color);
            padding-top: 24px;
        }

        .interval-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
        }

        .interval-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .interval-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 14px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .interval-btn:hover {
            background: rgba(255,255,255,0.02);
            border-color: #334155;
        }

        .interval-btn.active {
            background: var(--text-light);
            color: var(--bg-main);
            border-color: var(--text-light);
            font-weight: 600;
        }

        /* Feedback Toast/Indicator */
        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>Watering System</h1>
            <p>Node ID: arduino-kokulikuler</p>
        </div>
        
        <div class="control-section">
            <div class="control-info">
                <h3>Manual Control</h3>
                <div id="statusText" class="status-badge off">Menghubungkan...</div>
            </div>
            <input type="checkbox" id="toggleSwitch" class="power-switch">
        </div>
        
        <div class="interval-section">
            <span class="interval-label">Automated Interval</span>
            <div class="interval-grid">
                <button class="interval-btn" data-hours="0">Matikan Timer</button>
                <button class="interval-btn" data-hours="12">Setiap 12 Jam</button>
                <button class="interval-btn" data-hours="24">1 Hari Sekali</button>
                <button class="interval-btn" data-hours="48">2 Hari Sekali</button>
            </div>
        </div>

        <div class="footer-note" id="syncStatus">Sistem sinkron dengan cloud</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAes_0cn-mkmgxCdYGObX5knasM3Gs5WO4",
            authDomain: "arduino-kokulikuler.firebaseapp.com",
            databaseURL: "https://arduino-kokulikuler-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "arduino-kokulikuler",
            storageBucket: "arduino-kokulikuler.firebasestorage.app",
            messagingSenderId: "551582689767",
            appId: "1:551582689767:web:1aa9210339b4f0cbc6b542"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // References ke Firebase
        const pumpRef = ref(db, 'pompa_status'); 
        const intervalRef = ref(db, 'pompa_interval'); // Path baru untuk menyimpan data interval (dalam hitungan jam)

        const toggleSwitch = document.getElementById('toggleSwitch');
        const statusText = document.getElementById('statusText');
        const syncStatus = document.getElementById('syncStatus');
        const intervalButtons = document.querySelectorAll('.interval-btn');
        
        const clickSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
        clickSound.volume = 0.3;

        function triggerHaptic(type) {
            if (navigator.vibrate) {
                type === 'on' ? navigator.vibrate(40) : navigator.vibrate([40, 30, 40]);
            }
        }

        // =====================================
        // LOGIKA REVERSE UNTUK POMPA MANUAL
        // =====================================
        function updateUIFromDatabase(rawValue) {
            let isPumpPhysicalOn = (rawValue === "OFF"); // REVERSE LOGIC
            
            toggleSwitch.checked = isPumpPhysicalOn;
            
            if (isPumpPhysicalOn) {
                statusText.className = "status-badge on";
                statusText.innerText = "Pompa Aktif";
            } else {
                statusText.className = "status-badge off";
                statusText.innerText = "Pompa Mati";
            }
        }

        toggleSwitch.addEventListener('change', () => {
            const userWantsPumpOn = toggleSwitch.checked;
            const valueToSend = userWantsPumpOn ? "OFF" : "ON"; // REVERSE LOGIC
            
            syncStatus.innerText = "Memperbarui cloud...";
            
            set(pumpRef, valueToSend)
                .then(() => {
                    triggerHaptic(userWantsPumpOn ? 'on' : 'off');
                    try { clickSound.play(); } catch(e){}
                    syncStatus.innerText = "Perubahan tersimpan";
                })
                .catch((error) => {
                    console.error(error);
                    syncStatus.innerText = "Gagal memperbarui!";
                    toggleSwitch.checked = !userWantsPumpOn; // Revert UI jika gagal
                });
        });

        // Dengarkan status pompa secara Realtime
        onValue(pumpRef, (snapshot) => {
            const data = snapshot.val();
            if (data === "ON" || data === "OFF") {
                updateUIFromDatabase(data);
                syncStatus.innerText = "Sistem sinkron dengan cloud";
            } else {
                set(pumpRef, "ON"); // Default mati secara fisik
            }
        });


        // =====================================
        // LOGIKA MENU INTERVAL (BARU)
        // =====================================
        // Klik Handler untuk tombol interval
        intervalButtons.forEach(button => {
            button.addEventListener('click', () => {
                const hours = parseInt(button.getAttribute('data-hours'));
                
                syncStatus.innerText = "Mengatur interval...";
                
                // Menyimpan nilai interval (jam) ke Firebase. 
                // Di sisi Arduino, baca nilai 'pompa_interval' ini untuk logika millis() / RTC Anda.
                set(intervalRef, hours)
                    .then(() => {
                        if(navigator.vibrate) navigator.vibrate(50);
                        syncStatus.innerText = "Interval diperbarui";
                    })
                    .catch(err => {
                        syncStatus.innerText = "Gagal mengatur interval";
                        console.error(err);
                    });
            });
        });

        // Dengarkan status interval secara Realtime dari Firebase agar UI tombol sinkron
        onValue(intervalRef, (snapshot) => {
            const currentInterval = snapshot.val();
            
            // Hapus class active di semua tombol terlebih dahulu
            intervalButtons.forEach(btn => btn.classList.remove('active'));
            
            // Cari tombol yang sesuai dengan nilai di firebase dan beri class active
            let matched = false;
            intervalButtons.forEach(btn => {
                if (parseInt(btn.getAttribute('data-hours')) === currentInterval) {
                    btn.classList.add('active');
                    matched = true;
                }
            });
            
            // Jika tidak ada nilai atau tidak match, default ke "Matikan Timer" (0)
            if (!matched && currentInterval === null) {
                set(intervalRef, 0);
            }
        });
    </script>
</body>
</html>
